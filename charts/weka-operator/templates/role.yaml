{{- /* Rules come from files/rbac/role.yaml (make rbac). The generated Role holds the namespaced rules; it is re-emitted as a ClusterRole so it can be bound cluster-wide or per namespace (role_binding.yaml). */}}
{{- if not (.Files.Get "files/rbac/role.yaml") }}{{ fail "files/rbac/role.yaml is missing; run make rbac" }}{{- end }}
{{- range splitList "\n---\n" (.Files.Get "files/rbac/role.yaml") }}
{{- $doc := fromYaml . }}
{{- if $doc.kind }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $.Values.prefix }}-{{ eq $doc.kind "Role" | ternary "namespaced-role" "manager-role" }}
rules:
{{ toYaml $doc.rules }}
{{- end }}
{{- end }}
