---
# Default values for weka-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Prefix for all resources created by the operator (for example the controller Deployment and its service accounts).
# @section -- Operator runtime & logging
prefix: "weka-operator"

image:
  # -- Operator image repository.
  # @section -- Images
  repository: quay.io/weka.io/weka-operator
  # -- Operator image tag. Override only.
  # @default -- the chart version
  # @section -- Images
  tag: ""

wekaPodRuntime:
  image:
    # -- Go pod runtime image repository.
    # @section -- Images
    repository: quay.io/weka.io/weka-pod-runtime
    # -- Go pod runtime image tag.
    # @default -- the chart version
    # @section -- Images
    tag: ""
    # -- Go pod runtime image pull policy.
    # @section -- Images
    pullPolicy: IfNotPresent
  # -- Run weka_runtime.py instead of the Go pod runtime.
  # @section -- Images
  usePythonFallback: false

# -- kube-rbac-proxy sidecar image, used in front of the operator metrics endpoint.
# @section -- Images
kubeProxyImage: "quay.io/brancz/kube-rbac-proxy:v0.21.0"

# -- Driver builder images. `default` is the Ubuntu 22 builder, `ubuntu24` is used for Ubuntu 24 nodes, and
# `nixos` holds NixOS builders keyed by the gcc major of the NixOS kernel they are built for
# (a node's OS is reported by discovery as "nixos-gcc<major>").
# @section -- Images
builderImages:
  default: "quay.io/weka.io/weka-drivers-build-images:builder-ubuntu22-v1"
  ubuntu24: "quay.io/weka.io/weka-drivers-build-images:builder-ubuntu24-v1"
  nixos:
    gcc15: "quay.io/weka.io/weka-drivers-build-images:builder-nixos-gcc15-v2"

# -- Name of an existing imagePullSecret to attach to operator pods (optional).
# @section -- Images
imagePullSecret: ""
# -- Deploy the operator controller. When false, the controller Deployment is scaled to 0 replicas.
# @section -- Operator runtime & logging
deployController: true
# -- Deploy a standalone capacity-planner toolbox pod (runs `weka-capacity` from the
# operator image; exec into it to preview capacity plans without touching the operator pod).
# @section -- Capacity planner tool
deployCapacityPlanner: false
capacityPlanner:
  # -- Resources of the capacity-planner toolbox pod. Requests are small so it schedules anywhere;
  # limits are deliberately loose, since the pod idles until someone execs a plan run and admission
  # policies commonly reject a container with no limits at all. Raise the memory limit if a large
  # plan run gets OOM-killed.
  # @section -- Capacity planner tool
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 2
      memory: 4Gi
  # -- nodeSelector of the capacity-planner toolbox pod.
  # @section -- Capacity planner tool
  nodeSelector: {}
  # -- Tolerations of the capacity-planner toolbox pod.
  # @section -- Capacity planner tool
  tolerations: []

# -- Experimental: enables a custom HTTP API endpoint as an alternative to the K8s API.
# @section -- Advanced
enableClusterApi: false
# -- Enable leader election for the controller manager. Ensures only one controller manager is active.
# @section -- Operator runtime & logging
enableLeaderElection: true
# -- Custom endpoint to send OTLP traces and logs to (GRPC).
# If left empty, traces are sent to stdout in json format, and logs use standard Python logging.
# Optionally, set `otelPackagesInstallerImage` (commented out by default, for example `python:3.10-slim`, chosen
# for glibc compatibility with the weka-container image) to enable OTEL logging through an init container
# that installs the OpenTelemetry packages. Leave it unset to disable OTEL logging.
# @section -- Observability
otelExporterOtlpEndpoint: "https://otelcollector.prod.weka.io:4317"
# otelPackagesInstallerImage: "python:3.10-slim"

logging:
  # -- Operator log level.
  # @section -- Operator runtime & logging
  level: 0
  # -- Log only the time (without the date) in log lines.
  # @section -- Operator runtime & logging
  timeOnly: true
# -- Management proxy (envoy) image.
# @section -- Images
envoyImage: "docker.io/envoyproxy/envoy:v1.31-latest"
# -- Image used for maintenance pods; can be overridden with any other basic linux image.
# If required, a pull secret for it can be set with `maintenanceImagePullSecret` (commented out by default).
# @section -- Images
maintenanceImage: quay.io/weka.io/busybox:1.37.0
# maintenanceImagePullSecret: ""
# Weka Home connection settings, used by various operations that are not in the context of a
# WekaCluster/WekaContainer (for example GC of persistent storage, removal of tombstones).
wekahome:
  # -- Weka Home API endpoint.
  # @section -- Observability
  endpoint: https://api.home.weka.io
  # -- Allow insecure TLS connection to the wekahome endpoint (no server certificate validation).
  # @section -- Observability
  allowInsecureTLS: false
  # -- Name of the secret specifying the CA certificate chain. It is assumed that every target namespace will have such a secret.
  # @section -- Observability
  cacertSecret: ""
  # -- Send performance statistics to Weka Home. Connectivity and event data are sent regardless of this setting.
  # @section -- Observability
  enableStats: true
  report:
    # -- Periodically report operator CRs to Weka Home.
    # @section -- Observability
    enabled: true
    # -- Reporting interval.
    # @section -- Observability
    interval: 60s

# -- Timeout of a single reconcile run.
# @section -- Timeouts & intervals
reconcileTimeout: 30m
# -- Timeout of commands the operator executes inside pods.
# @section -- Timeouts & intervals
kubeExecTimeout: 5m
# -- How long a terminating backend pod may sit before the operator forces graceful
# deactivation. 0 = never (default). On managed cloud nodes (AWS/EKS, OCI/OKE) the operator
# overrides this to 30m so managed-nodegroup drains don't hang. Per-cluster override:
# spec.overrides.podTerminationDeactivationTimeout.
# @section -- Timeouts & intervals
podTerminationDeactivationTimeout: 0
# -- How long to wait, once IO processes are reported up, before considering the container's
# applied image settled. 0 = don't wait (default). Per-object override:
# spec.overrides.waitSinceIoProcessesUpTimeout on the WekaCluster (backend containers) or on the
# WekaClient (client containers).
# @section -- Timeouts & intervals
waitSinceIoProcessesUpTimeout: 0
# -- Maximum number of workers for each reconciler (for each resource type).
# @section -- Operator runtime & logging
maxWorkers:
  wekaCluster: 5
  wekaContainer: 50
  wekaClient: 5
  wekaManualOperation: 5
  wekaPolicy: 5

# @ignored
wekaAllocZombieDeleteAfter: 5m

# -- Bind address of the operator metrics endpoint.
# @section -- Networking & ports
operatorMetricsBindAddress: "127.0.0.1:8080"
# -- Bind address of the node-agent metrics endpoint.
# @section -- Networking & ports
nodeAgentMetricsBindAddress: ":8090"
# -- Bind address of the operator health probe endpoint.
# @section -- Networking & ports
healthProbeBindAddress: ":8081"

# -- OpenShift (OCP) settings: driver toolkit access, hugepages provisioning through a Tuned profile,
# and CSI SELinux policy placement.
# `hugepageConfiguration.enabled` automatically creates a Tuned profile on the matching nodes to apply
# hugepages (WARNING: do not enable it if you already use custom Tuned profiles for hugepages).
# `retainMachineConfig`: if true, the machine configurations are not removed when uninstalling the operator, so an
# operator reinstall does not cause a machine config pool update.
# `csi.machineConfigLabels`: which machineconfig pools to install the Weka SELinux policy on (by default both
# workers and control plane nodes).
# @section -- Platform compatibility
ocpCompatibility:
  driverToolkitSecretName:
  driverToolkitImageBaseUrl: quay.io/openshift-release-dev/ocp-v4.0-art-dev
  hugepageConfiguration:
    enabled: false
    machineConfigNodeLabel: "worker"
    hugepageSize: "2M"
    hugepagesCount: 4000
    nodeSelector:
      matchLabels:
        - node-role.kubernetes.io/worker: ""
  retainMachineConfig: true
  csi:
    machineConfigLabels:
      - "worker"
      - "master"

# -- Google Kubernetes Engine (GKE) settings. `hugepageConfiguration.enabled` automatically configures hugepages on the
# GKE nodes, and `disableDriverSigning` disables driver signing enforcement on them
# (WARNING: both reboot nodes forcefully!).
# @section -- Platform compatibility
gkeCompatibility:
  gkeServiceAccountSecret: ""
  hugepageConfiguration:
    enabled: false
    hugepageSize: "2M"
    hugepageCount: 4000
  disableDriverSigning: false

manager:
  # -- Resources of the operator manager container.
  # @section -- Operator runtime & logging
  resources:
    limits:
      cpu: 1000m
      memory: 4096Mi
    requests:
      cpu: 250m
      memory: 64Mi
  # -- nodeSelector of the operator pod.
  # @section -- Operator runtime & logging
  nodeSelector: {}
  # -- Tolerations of the operator pod. When empty, the top-level `tolerations` are used.
  # @section -- Tolerations
  tolerations: []
  # -- Extra labels added to the operator pod.
  # @section -- Operator runtime & logging
  labels: {}
  # -- Extra volumes added to the operator Deployment pod spec (standard PodSpec `volumes` shape).
  # The reserved name is `tmpdir`.
  # @section -- Operator runtime & logging
  extraVolumes: []
  # -- Extra volumeMounts for the `manager` container. The reserved path is `/tmp` (on, under, or
  # above it) -- it holds the webhook serving certs. A mount at `/` is rejected for the same reason.
  # @section -- Operator runtime & logging
  extraVolumeMounts: []
  # -- Operator logger settings: verbosity `level`, output `format` and `callerDirLvl` (how many caller
  # directory levels to include in log lines).
  # @section -- Operator runtime & logging
  loggerSettings:
    level: 0
    format: raw
    callerDirLvl: 1

# -- Debug sleep applied to weka pods on terminate (passed as WEKA_OPERATOR_DEBUG_SLEEP); overridable per container via spec.overrides.debugSleepOnTerminate.
# @ignored
debugSleep: 3

# -- Pod-level securityContext applied to every privileged / hostPath pod produced by the operator.
# Opt-in: leave empty for no override. Accepts any subset of the standard corev1.PodSecurityContext
# shape; every field you set flows through to the produced pods unchanged.
# Example to satisfy Kyverno's require-apparmor-on-privileged-or-hostpath
# (Unconfined is recommended for weka, as its containers rely on DPDK/RDMA/device
# access that RuntimeDefault may restrict): `{appArmorProfile: {type: Unconfined}}`.
# @section -- Advanced
podSecurityContext: {}

# -- Tolerations of the operator pod, used when `manager.tolerations` is empty.
# @section -- Tolerations
tolerations: []
# -- Identifier attached to the OTEL telemetry emitted by the operator and node agent to tell deployments apart.
# @section -- Observability
deploymentIdentifier: ""

# === Lifecycle hooks ===========================================================
# Operator behavior toggles for cleanup on environment drift, eviction,
# throttling, and toleration shaping. Defaults below; only set what you change.

# -- Removed-node backend cleanup mode when a backend WekaContainer's target node
# leaves the K8s cluster. Tri-state (quote the value):
#   "false" - never delete the container (previous default).
#   "true"  - delete the container immediately.
#   "auto"  - (default) hold the container in Stale status for a grace period, then
#             delete only if the node is still gone. Grace is 30m on managed cloud
#             (AWS/OCI) and 24h otherwise; if the node returns within the window the
#             container recovers instead of being torn down.
# An unset/empty value uses "auto"; an unrecognized value fails closed to "false".
# @section -- Node lifecycle & cleanup
cleanupRemovedNodes: "auto"
# -- Delete backend WekaContainers when their nodeSelector no longer matches the
# assigned node. Aux containers are unaffected.
# @section -- Node lifecycle & cleanup
cleanupOnNodeSelectorMismatch: false
# -- Delete client WekaContainers when their nodeSelector no longer matches the
# assigned node.
# @section -- Node lifecycle & cleanup
cleanupClientsOnNodeSelectorMismatch: false
# -- Delete WekaContainers (except aux) when node taints are no longer tolerated.
# @section -- Node lifecycle & cleanup
cleanupContainersOnTolerationsMismatch: false

# -- When a backend pod begins terminating (DeletionTimestamp set, including
# API-driven evictions / drains), transition the container to graceful
# deactivation rather than force-stopping.
# @section -- Node lifecycle & cleanup
evictContainerOnDeletion: false
# -- Evicted-pod cleanup: a background goroutine periodically deletes
# operator-managed pods stuck in Phase=Failed, Reason=Evicted.
# `enabled` runs the cleanup goroutine; `interval` is its tick interval.
# @section -- Node lifecycle & cleanup
evictedPodCleanup:
  enabled: true
  interval: 2m

# -- Throttle container deactivation to one per role per cluster per minute,
# preventing cascading removals.
# @section -- Node lifecycle & cleanup
removalThrottlingEnabled: true
# -- Throttle envoy container recreation to one per cluster per minute when the
# envoy process is missing.
# @section -- Node lifecycle & cleanup
recreateUnhealthyEnvoyThrottlingEnabled: true

# -- Force SMT/full-pcpus-only CPU alignment (round weka pod CPU up to an even number
# on hyperthreaded nodes). Default false = auto-detect per node from the kubelet's
# cpuManagerPolicyOptions full-pcpus-only setting (needs nodes/proxy RBAC). Set true
# to force alignment operator-wide, e.g. when the kubelet configz read is unavailable.
# @section -- Drives & capacity
fullPcpusOnly: false
# -- Pods omit standard "unhealthy node" tolerations (unschedulable, not-ready, unreachable).
# @section -- Tolerations
skipUnhealthyToleration: false
# -- Client pods omit auto-generated NoSchedule tolerations.
# @section -- Tolerations
skipClientNoScheduleToleration: false
# -- Aux pods (drivers, adhoc ops, telemetry) omit auto-generated NoSchedule tolerations.
# @section -- Tolerations
skipAuxNoScheduleToleration: false
# -- Disable all operator management of the AWS ASG termination lifecycle hook (detection and
# creation). Scale-down drive-drain protection is unavailable while set. Do not combine with a
# manually registered weka-drive-drain hook: the operator will not release held instances, so they
# will sit in Terminating:Wait until the hook's HeartbeatTimeout expires.
# @section -- Node lifecycle & cleanup
skipAwsTerminationLifecycleHook: false
# -- Skip taint/toleration validation for client containers, assuming all nodes
# tolerate all clients.
# @section -- Tolerations
skipClientsTolerationValidation: true
# -- Tolerations-mismatch cleanup tuning (paired with cleanupContainersOnTolerationsMismatch).
# When `enableIgnoredTaints` is set, the taints listed in `ignoredTaints` are ignored when checking for toleration mismatch.
# @section -- Tolerations
tolerationsMismatchSettings:
  enableIgnoredTaints: true
  ignoredTaints:
    - "node.kubernetes.io/unschedulable"
    - "node.kubernetes.io/not-ready"
    - "node.kubernetes.io/unreachable"

# === end lifecycle hooks =======================================================

# -- Remove failed drives from Weka once drive containers report added drives that are not aligned with allocations.
# @section -- Drives & capacity
removeFailedDrives: false

# -- If true, allows multiple network protocols containers per node, like NFS for multiple weka clusters or S3+NFS on same nodes.
# In case of multiple clusters, upgrades need to be synchronized / spares kept for per-node eviction.
# @section -- NFS/SMB
allowMultipleProtocolsPerNode: false

# -- Image of the drive signing tool.
# @section -- Images
signDrivesImage: quay.io/weka.io/weka-sign-tool:cfbc60804cb627bcd3b7fde8e9c5e82f6f24c0be-multiarch  # +multiarch build

# -- Taskmon settings; `defaultImage` is the default taskmon image.
# @section -- Images
taskmon:
  defaultImage: quay.io/weka.io/taskmon:92b35aa657e9aba4782b4530b81107fff4c19847_x86_64

nodeAgent:
  # -- Node-agent DaemonSet container resources.
  # On VM nodes using the native containerd snapshotter (e.g. KubeVirt guests without
  # overlayfs support), the entire container image is copied into the writable snapshot
  # and counted as ephemeral storage. On such nodes rootfs usage equals the image size
  # (~300Mi for weka-operator), regardless of any actual writes by the process.
  # Increase `ephemeral-storage` if node-agent pods are evicted on such nodes.
  # @section -- Node agent
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
      ephemeral-storage: 400Mi
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 100Mi
  # -- Tolerations of the node-agent DaemonSet.
  # @section -- Node agent
  tolerations:
    - operator: Exists
  # -- nodeSelector of the node-agent DaemonSet.
  # @section -- Node agent
  nodeSelector: {}
  # -- Affinity of the node-agent DaemonSet.
  # @section -- Node agent
  affinity: {}
  # -- Host path used for node-agent persistence. The default suits generic OSes; override with
  # /root/k8s-weka for OpenShift, or /mnt/stateful_partition/k8s-weka for Google Container-Optimized OS.
  # @section -- Node agent
  persistencePaths: /opt/k8s-weka
  # -- Kubelet path, for clusters where Kubernetes is not installed in the default folder. Used to locate the
  # host's kubelet device-plugins directory for the NUMA region device plugin.
  # @section -- Node agent
  kubeletPath: /var/lib/kubelet
  # -- NUMA region device plugin. When `enabled`, each node's NUMA regions are advertised as
  # weka.io/numa-region-<N> extended resources via a kubelet device plugin. Requires access to the
  # host's kubelet device-plugins directory. Off by default.
  # @section -- Node agent
  devicePlugin:
    enabled: false

metrics:
  # -- Cluster-level metrics service. `enabled` toggles it, `pollingRate` is the polling interval and `image` is
  # the image of the metrics service pods. Optionally set `nodeSelector` (commented out by default, for example
  # `{weka.io/monitoring: "true"}`) to pin the monitoring service pods; if unset, it inherits the WekaCluster nodeSelector.
  # @section -- Observability
  clusters:
    enabled: true
    pollingRate: 60s
    image: docker.io/library/nginx:1.27.3
    # nodeSelector:
    #   weka.io/monitoring: "true"
  # -- Container-level metrics. `enabled` toggles it, `pollingRate` is the polling interval and
  # `requestsTimeouts` holds the timeouts of the `register` and `getContainerInfo` requests.
  # @section -- Observability
  containers:
    enabled: true
    pollingRate: 60s
    requestsTimeouts:
      register: 3s
      getContainerInfo: 10s
  # -- Scrape pod cpu/memory from the Kubernetes metrics.k8s.io API and report it on reconcile
  # spans. Requires metrics-server to be installed in the cluster; set `enabled` to false if it is not,
  # to avoid a per-container "Error getting pod metrics" warning. Only the cpu/memory
  # attributes are affected: reconcile spans still carry the weka-native process and drive
  # counters, and metrics.containers.* is independent.
  # @section -- Observability
  podMetrics:
    enabled: true

# -- Not referenced by the chart templates or the operator.
# @ignored
localDataStorageClass: ""
# -- Name of a PVC used as the default local data PVC for containers that do not set one in their spec.
# @section -- Advanced
localDataPvc: ""
upgrade:
  # -- Minimum percentage of the cluster's compute containers that must be active before the upgrade proceeds.
  # @section -- Upgrade
  computeThresholdPercent: 90
  # -- Minimum percentage of the cluster's drive containers that must be active before the upgrade proceeds.
  # @section -- Upgrade
  driveThresholdPercent: 90
  # -- Rolling upgrade aborts when more than this percentage of containers are already marked for deletion.
  # @section -- Upgrade
  maxDeactivatingContainersPercent: 10
  # -- Image pre-pull before an upgrade. When `enabled`, images are pre-pulled on the nodes before the upgrade,
  # and `timeout` is the maximum time to wait for all nodes to pull the image.
  # @section -- Upgrade
  imagePrePull:
    enabled: true
    timeout: 20m
# -- Create PodMonitors for the node-agent (`app: weka-node-agent`) and cluster-monitoring
# (`app: weka-cluster-monitoring`) pods. Created only when the monitoring.coreos.com/v1 API is available in the cluster.
# @section -- Observability
podMonitor:
  enabled: true

# -- DNS policy of operator-created pods: `k8sNetwork` for pods without hostNetwork: true,
# `hostNetwork` for pods with hostNetwork: true. Empty leaves the operator default.
# @section -- Networking & ports
dnsPolicy:
  k8sNetwork: ""
  hostNetwork: ""

# -- Default timeouts and intervals of operator garbage collection:
# `deleteEnvoyWithoutS3NeighborTimeout` and `deleteUnschedulablePodsAfter`;
# `unschedulableDriveContainerGCTimeout` is how long a clusterCapacity drive container may stay unscheduled before the
# operator deletes it so the planner can re-place its capacity on a node that can host it;
# `stuckAdhocPodTimeout` is how long an adhoc-op container's pod may fail to produce a result before the operator
# deletes the container, and `stuckAdhocPodStartingTimeout` is the longer variant that applies while the pod is still
# pulling its image / creating containers.
# @section -- Timeouts & intervals
defaultIntervals:
  deleteEnvoyWithoutS3NeighborTimeout: 5m
  deleteUnschedulablePodsAfter: 1m
  unschedulableDriveContainerGCTimeout: 2m
  stuckAdhocPodTimeout: 10m
  stuckAdhocPodStartingTimeout: 30m

nfs:
  # -- Port for the NFS mountd service.
  # @section -- NFS/SMB
  mountdPort: 18000
  # -- Port for the NFS lock manager service.
  # @section -- NFS/SMB
  lockmanagerPort: 18001
  # -- Port for the NFS notify service.
  # @section -- NFS/SMB
  notifyPort: 18002

smbw:
  # -- Size of /dev/shm for SMB-W containers (for corosync shared memory).
  # @section -- NFS/SMB
  shmSize: "8Gi"

# -- Capacity planner constraints. `maxCoresPerContainer` is Weka's own per-container core cap (drive or compute).
# `driveSharing.computeToTlcDriveCoreRatio` and `driveSharing.computeToQlcDriveCoreRatio` set the compute:drive-core
# ratios for TLC and QLC drives: requiredComputeCores = max(totalDriveCores, ceil(tlcRatio*tlcCores + qlcRatio*qlcCores)),
# and the drive-core count itself is always a hard 1:1 floor regardless of these ratios.
# `fullDrives.computeToDriveCoreRatio`: when unset (null), the planner prefers 2:1 and, when the compute nodes cannot host
# that, relaxes toward 1:1 (infeasible only below 1:1); set a number to enforce that ratio strictly.
# @section -- Drives & capacity
capacityPlannerConstraints:
  maxCoresPerContainer: 19
  driveSharing:
    computeToTlcDriveCoreRatio: 1.0
    computeToQlcDriveCoreRatio: 0.0
  fullDrives:
    computeToDriveCoreRatio: null

# Cluster capacity configuration
# Used when spec.dynamicTemplate.clusterCapacity is set on a WekaCluster.
clusterCapacity:
  # -- Max TLC capacity (GiB) one drive core can serve. The default is 5 TiB.
  # @section -- Drives & capacity
  tlcCapacityPerCoreGiB: 5120
  # -- Max QLC capacity (GiB) one drive core can serve. The default is 50 TiB.
  # @section -- Drives & capacity
  qlcCapacityPerCoreGiB: 51200
  # -- Grow imbalance factor: when each new drive container would be >= this factor x the existing
  # containers' average capacity, the planner lays out a fresh balanced set instead.
  # @section -- Drives & capacity
  imbalanceFactor: 8.0
  # -- Relative capacity deadband: a clusterCapacity growth is ignored when the shortfall is smaller
  # than desired capacity x this fraction. Avoids re-planning/thrashing on trivial bumps.
  # Set to 0 to disable the deadband (any positive capacity delta triggers growth).
  # @section -- Drives & capacity
  deadbandFraction: 0.05

# Drive sharing configuration
driveSharing:
  # -- Global default ratio of drive types (TLC vs QLC) when using drive sharing, as integer parts of relative
  # proportions. Used when spec.dynamicTemplate.driveTypesRatio is not set on the WekaCluster; can be overridden per
  # cluster via that field. Drive sharing is enabled by setting containerCapacity in spec.dynamicTemplate of WekaCluster.
  # For example tlc: 1, qlc: 0 = 100% TLC; tlc: 4, qlc: 1 = 80% TLC, 20% QLC; tlc: 1, qlc: 1 = 50% TLC, 50% QLC.
  # NOTE: tlc must be > 0. QLC-only configurations (tlc: 0) are not supported.
  # @section -- Drives & capacity
  driveTypesRatio:
    tlc: 1
    qlc: 10

  # -- Maximum number of virtual drives per CPU core when using drive sharing.
  # @section -- Drives & capacity
  maxVirtualDrivesPerCore: 8

  # -- Enforce minimum drives per type per core when using drive sharing with mixed TLC/QLC.
  # When true: per-type constraints (cores <= tlcDrives AND cores <= qlcDrives).
  # When false: combined constraint (cores <= tlcDrives + qlcDrives <= maxDrives).
  # Only affects mixed TLC/QLC configurations; single-type allocations behave the same either way.
  # @section -- Drives & capacity
  enforceMinDrivesPerTypePerCore: true

  # -- Enable dynamic drive scaling for shared drives mode (containerCapacity or driveCapacity configured;
  # traditional numDrives-only mode is not affected).
  # When false: containers are never extended in place on a spec change - existing drive
  # containers won't automatically allocate additional drives when containerCapacity increases or
  # driveTypesRatio changes, and clusterCapacity growth is satisfied by CREATING new containers on
  # fresh failure domains only (reported infeasible if no free FDs/nodes can hold the delta). To
  # grow a single container you must delete and recreate it. Initial allocation still works.
  # When true (opt-in): containers automatically allocate additional drives to match the new
  # capacity/ratio, and clusterCapacity may grow existing drive containers in place. Capacity-only
  # grows are applied live (no pod restart); a grow that also needs more cores/hugepages is not
  # applied automatically (the operator only emits a warning) - the pod must be terminated manually
  # to pick up the new spec.
  # @section -- Drives & capacity
  enableDynamicDriveScalingForSharedDrives: false

  # -- Minimum relative per-container growth (target-cur)/cur to grow an existing drive container in
  # place; smaller grows are skipped (prefer creating a new FD at the uniform chunk size T instead,
  # or emit infeasible if no spare node is available).
  # @section -- Drives & capacity
  minGrowthFraction: 0.2

  # -- Max fraction by which creating new failure domains may over-provision a drive pool's desired
  # capacity. A create-new that would exceed desiredRaw * (1 + maxOverProvisionFraction) is not
  # allowed (falls back to grow or infeasible).
  # @section -- Drives & capacity
  maxOverProvisionFraction: 0.2

  # -- Max allowed ratio between the largest and smallest drive in the IndirectionUnitBig
  # pool. Overrides weka's built-in limit (MAX_DRIVE_CAPACITY_RATIO=8). Relevant for
  # drive-sharing clusters that mix very differently sized drives.
  # @section -- Drives & capacity
  smallBigDiskSizesMaxProportionFactor: 100

  # -- SSD proxy settings (drive sharing mode). `hugepagesOffsetMiB` is the hugepages offset in MiB kept as a
  # buffer from weka's --memory for SSD proxy containers (null uses the operator default of 200 MiB).
  # `imageOverride`, if set, is used as the ssdProxy container image instead of the cluster image; it is also the
  # fallback target image for the `rotate-ssdproxy` WekaManualOperation when
  # payload.rotateSsdProxyPayload.targetImage is left empty.
  # @section -- Drives & capacity
  ssdProxy:
    hugepagesOffsetMiB: ~
    imageOverride: ""

# -- Hugepages capacity ratio for TLC drives, used for compute containers. Hugepages are allocated from raw drive capacity:
# clusterHugepages = tlcCapacityGiB / hugepagesTlcRatio + qlcCapacityGiB / hugepagesQlcRatio.
# TLC drives require more hugepages per GiB than QLC drives.
# @section -- Hugepages
hugepagesTlcRatio: 1000
# -- Hugepages capacity ratio for QLC drives, see `hugepagesTlcRatio`.
# @section -- Hugepages
hugepagesQlcRatio: 6000

# -- Lower the clusterCapacity protection floor from the production 3+2+0
# (stripeWidth/data>=3, redundancyLevel/parity>=2, hotSpare>=0 / hot spare optional) to
# single-parity 2+1+0, enabling QA/test clusters such as 2+1 (minFdNum=3). QA/TEST ONLY: a single parity chunk
# leaves a stripe unprotected during rebuild. When true, the operator also sets the
# allow_1_parity weka override at cluster formation (weka rejects parity=1 without it).
# @section -- Drives & capacity
allowSingleParity: false

# -- Default protection scheme applied to WekaClusters that leave these fields at 0.
# A non-zero per-cluster spec value wins; a spec value of 0 is treated as "unset" and
# falls back to the default below (so a cluster cannot force e.g. hotSpare=0 while a
# non-zero default is configured here).
# stripeWidth/redundancyLevel: 0 means "no default", so the operator skips the matching
# `weka cluster update` call and the weka CLI default applies.
# hotSpare: the operator always runs `weka cluster hot-spare <value>` at formation, so 0
# here sets hot spare explicitly to 0 (it is NOT left at a weka CLI default).
# Note: clusterCapacity clusters are still rejected at admission unless the *effective*
# protection (spec value, else this default) meets the 3+2+0 floor (see allowSingleParity).
# @section -- Drives & capacity
protection:
  stripeWidth: 0
  redundancyLevel: 0
  hotSpare: 0

# -- Hugepages update propagation to existing compute/drive containers.
# User-set hugepages values (spec.dynamicTemplate.computeHugepages / driveHugepages) are always
# propagated to existing containers regardless of these flags.
# `compute` and `drive` control auto-calculation from cluster capacity for containers where no
# explicit value is set in the spec. S3/NFS/DataServices hugepages are always
# propagated using per-role defaults unless overridden in the spec.
# @section -- Hugepages
hugepagesUpdate:
  compute: false
  drive: false

# -- Maximum hugepages (MiB) for compute containers. 0 = no cap.
# Applied during both initial container creation and hugepages updates.
# @section -- Hugepages
computeMaxHugepagesMiB: 360000

portAllocation:
  # -- Starting port for Weka container port allocation: the base port from which the operator
  # allocates port ranges for Weka clusters.
  # @section -- Networking & ports
  startingPort: 35000

# -- Management proxy (envoy) settings. Applies to every WekaCluster; no per-WekaCluster override.
# `hostNetwork`: deploy Envoy proxy on host network.
# `ingressBaseDomain`: base domain for ingress hostname generation (format: namespace--clustername.basedomain);
# if empty, ingress creation is disabled. `ingressClass`: ingress class of the ingress resource; if empty, the
# default ingress class of the cluster is used.
# The tunables below are commented out so the operator's defaults apply:
# `replicas` (default 2; 0 parks the proxy without uninstalling it; under hostNetwork all replicas bind the same node
# ports and nothing keeps two of them, or two clusters' proxies which share admin port 9901, off one node, so replicas
# beyond the number of usable nodes crash-loop; avoid 1 with hostNetwork, since host ports force in-place replacement
# and the proxy goes down on every config change);
# `healthyPanicThreshold` (percentage of healthy upstreams below which Envoy load balances to all hosts including
# unhealthy ones; default 50, Envoy's own default; 0 always honours health checks, so a fully failed backend set returns 503);
# `adminBindAddress` (address the Envoy admin endpoint binds to; must be bindable by the pod: 0.0.0.0, ::, 127.0.0.1 or
# ::1, other values crash-loop every replica; defaults to 0.0.0.0, or 127.0.0.1 under hostNetwork, since the admin API is
# unauthenticated and includes /quitquitquit; a loopback address with hostNetwork false makes kubelet probes degrade to
# TCP, which cannot detect a wedged Envoy).
# @section -- Networking & ports
managementProxy:
  hostNetwork: false
  # replicas: 2
  # healthyPanicThreshold: 50
  # adminBindAddress: "0.0.0.0"
  ingressBaseDomain: ""
  ingressClass: ""

# -- Syslog package choice: "auto" (go-syslog if available, otherwise syslog-ng), "go-syslog" or "syslog-ng".
# @section -- Advanced
syslogPackage: "auto"

# -- Manual version bump to trigger pod rotation when pod config shape changes via helm.
# @section -- Advanced
podConfigVersion: "1"

# -- If true, include WekaRuntimeVersion in the pod config hash calculation.
# When enabled, bumping WekaRuntimeVersion triggers coordinated rolling pod rotation.
# Default false to avoid unexpected rotations on operator upgrade.
# @section -- Advanced
enablePodConfigCodeVersionRotation: false

# -- If true, rotate pods for containers that have no pod-config-version annotation yet
# (pre-existing containers from before this feature). Default false to avoid mass restarts on upgrade.
# @section -- Advanced
allowRotateNonAnnotatedPodConfigHash: false

# -- Proxy configuration for the drivers loader pod and weka home.
# @section -- Networking & ports
proxy: ""

# -- Priority classes. `initial` and `targeted` are the priority class names for initial weka containers and for
# re-scheduled weka containers, node agents, CSI controller and CSI node server. The operator always creates the
# default priority classes weka-initial-no-evict and weka-targeted-no-evict; override the names to use your own
# existing priority classes instead. `defaultValues` holds the values of the default priority classes that are
# always created.
# @section -- Advanced
priorityClasses:
  initial: "weka-initial-no-evict"
  targeted: "weka-targeted-no-evict"
  defaultValues:
    initial: 900000000
    targeted: 1000000000

csi:
  # -- Install the embedded CSI driver.
  # @section -- CSI
  installationEnabled: false
  # -- SELinux support mode for the embedded CSI driver: "auto" (auto-detect from host /etc/selinux/config),
  # "enforced" (always apply SELinux contexts to volume mounts) or "off" (never apply SELinux contexts).
  # @section -- CSI
  selinuxSupport: "auto"
  # -- Kubelet path, in cases Kubernetes is installed not in the default folder.
  # @section -- CSI
  kubeletPath: "/var/lib/kubelet"
  # -- Allow the CSI node driver to override mount options from PVC/Pod annotations
  # during NodePublishVolume. Security-gated capability.
  # TRUST IMPLICATION: when enabled, mount options are no longer fixed by the
  # StorageClass alone. They can be influenced by annotations on the PVC/Pod,
  # which any principal able to create a Pod/PVC in a namespace can set. This
  # widens who can affect on-host mount behavior (e.g. caching/coherency,
  # read-only vs read-write). Leave false unless you trust all such principals.
  # The exact annotation keys honored are defined by the csi-wekafs driver
  # version in use (see the csi-wekafs docs for the release pinned in `image`).
  # Note: toggling this on an existing cluster rolls the CSI node DaemonSet.
  # @section -- CSI
  allowMountOptionOverrides: false
  # -- Do not create the CSI StorageClass.
  # @section -- CSI
  storageClassCreationDisabled: false
  # -- CSI driver (csi-wekafs) image.
  # @section -- CSI
  image: "quay.io/weka.io/csi-wekafs:v2.9.4"
  # -- csi-provisioner sidecar image.
  # @section -- CSI
  provisionerImage: "registry.k8s.io/sig-storage/csi-provisioner:v5.3.0"
  # -- csi-attacher sidecar image.
  # @section -- CSI
  attacherImage: "registry.k8s.io/sig-storage/csi-attacher:v4.9.0"
  # -- livenessprobe sidecar image.
  # @section -- CSI
  livenessProbeImage: "registry.k8s.io/sig-storage/livenessprobe:v2.16.0"
  # -- csi-resizer sidecar image.
  # @section -- CSI
  resizerImage: "registry.k8s.io/sig-storage/csi-resizer:v1.14.0"
  # -- csi-snapshotter sidecar image.
  # @section -- CSI
  snapshotterImage: "registry.k8s.io/sig-storage/csi-snapshotter:v8.3.0"
  # -- csi-node-driver-registrar sidecar image.
  # @section -- CSI
  registrarImage: "registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.14.0"
  # -- Prevent new workloads from being scheduled on a node while its client container is not running.
  # @section -- CSI
  preventNewWorkloadOnClientContainerNotRunning: true
  # -- CSI driver log level.
  # @section -- CSI
  logLevel: 5
  # -- Run the CSI pods with hostNetwork.
  # @section -- CSI
  hostNetwork: false
  # -- CSI controller container resources, per container (wekafs, csiAttacher, csiProvisioner, csiResizer,
  # csiSnapshotter, livenessProbe), each with `limits` and `requests`.
  # @section -- CSI
  controller:
    resources:
      wekafs:
        limits:
          cpu: 1
          memory: 3Gi
        requests:
          cpu: 128m
          memory: 128Mi
      csiAttacher:
        limits:
          cpu: 1
          memory: 1Gi
        requests:
          cpu: 4m
          memory: 48Mi
      csiProvisioner:
        limits:
          cpu: 1
          memory: 3Gi
        requests:
          cpu: 128m
          memory: 128Mi
      csiResizer:
        limits:
          cpu: 1
          memory: 2Gi
        requests:
          cpu: 4m
          memory: 48Mi
      csiSnapshotter:
        limits:
          cpu: 1
          memory: 1Gi
        requests:
          cpu: 4m
          memory: 48Mi
      livenessProbe:
        limits:
          cpu: 1
          memory: 1Gi
        requests:
          cpu: 12m
          memory: 48Mi
  # -- CSI node container resources, per container (wekafs, livenessProbe, csiRegistrar), each with `limits` and `requests`.
  # @section -- CSI
  node:
    resources:
      wekafs:
        limits:
          cpu: 1
          memory: 2Gi
        requests:
          cpu: 128m
          memory: 128Mi
      livenessProbe:
        limits:
          cpu: 1
          memory: 1Gi
        requests:
          cpu: 12m
          memory: 44Mi
      csiRegistrar:
        limits:
          cpu: 1
          memory: 1Gi
        requests:
          cpu: 8m
          memory: 52Mi

# -- Admission control master switch. When true, installs the VWC with
# failurePolicy=Fail; every operator restart briefly blocks WekaCluster/WekaClient
# writes. Per-object bypass: set the
# `weka.io/skip-admission` label on the CR. Emergency recovery:
# `kubectl delete validatingwebhookconfiguration weka-operator-validating-webhook-configuration`.
# @section -- Admission control
enableAdmissionControl: true

# -- Admission policies. `mode` is the default mode applied to all policies: `relaxed` uses the "relaxed" column
# of the per-policy mapping, `strict` the "strict" column. Per-policy overrides (`policies`, a map of policy name to
# `default`, `warn` or `error`, commented out by default) win over `mode`. The available policies and their strict/relaxed
# defaults are listed in the commented `policies` block in values.yaml.
# @section -- Admission control
admissionPolicies:
  mode: relaxed

  # Per-policy overrides. Values: default | warn | error.
  # Uncomment any policy you want to pin regardless of `mode`.
  #
  # policies:
  #   # CPU cores requested by Weka containers must fit on the
  #   # matched nodes' allocatable CPU. Fires when the spec
  #   # over-commits CPU and pods would be unschedulable.
  #   cluster_cores_available:              default  # strict: warn   | relaxed: warn
  #
  #   # drive:compute core ratio is recommended to stay at or below
  #   # 1:2 — compute does more CPU-bound work per I/O than drive,
  #   # so an over-weighted drive side saturates the front end under
  #   # load. Pure advisory (warn in both modes); cores=0 is treated
  #   # as 1 (operator's reconcile-time default).
  #   cluster_drive_compute_core_ratio:     default  # strict: warn   | relaxed: warn
  #
  #   # Hard floor: total compute cores must be at least total drive cores (1:1), or the plan is
  #   # infeasible — raise computeContainers/computeCores or lower the drive side.
  #   cluster_compute_drive_cores_floor:    default  # strict: error  | relaxed: warn
  #
  #   # A pinned driveCores/computeCores must not exceed capacityPlannerConstraints.maxCoresPerContainer (silent
  #   # when 0). A policy, not a schema max, so a cluster already pinned above it isn't blocked from
  #   # the very edit that would fix it.
  #   cluster_cores_per_container_limit:    default  # strict: error  | relaxed: warn
  #
  #   # numDrives+driveCapacity only: the per-drive capacity needs more drive cores than numDrives
  #   # allows (weka requires >=1 physical drive per drive core, and numDrives caps driveCores).
  #   # Reduces to driveCapacity > clusterCapacity.tlcCapacityPerCoreGiB, so raising numDrives never
  #   # helps — it scales the capacity and the core requirement together. Lower driveCapacity, or
  #   # switch to containerCapacity/clusterCapacity so cores are derived from the total instead.
  #   cluster_num_drives_below_required_cores: default  # strict: error  | relaxed: warn
  #
  #   # An explicit driveCores below what the configured drive capacity (containerCapacity, or
  #   # numDrives+driveCapacity) requires — surfaced at admission instead of failing later as
  #   # DriveCapacityResourceShortfall on add-drive. Raising driveCores fixes it, which is why this
  #   # stays a warning. Silent in auto-full-drives mode: {numDrives: 4, driveCores: 3} is blessed
  #   # there (all four drives claimed, run on three cores), not a shortfall.
  #   cluster_drive_cores_below_capacity:   default  # strict: warn   | relaxed: warn
  #
  #   # driveContainers × numDrives must not exceed the signed (non-blocked) FULL drives across
  #   # matched drive-role nodes. Full-drives clusters only — drive-sharing's numDrives counts
  #   # capacity-carved virtual drives instead (see cluster_capacity_*).
  #   cluster_signed_drives:                default  # strict: error  | relaxed: warn
  #
  #   # Auto-full-drives ("acts as a daemonset", i.e. no container-count or capacity field set): runs
  #   # the capacity planner at apply time and rejects a plan it reports infeasible — one that would
  #   # create nothing anywhere. Covers a pinned numDrives or driveCores above a node's signed full
  #   # drive count, and compute hugepages (which scale with total claimed capacity) exceeding what any
  #   # compute-eligible node has. The message is the planner's own, with its remedies. A driveCores
  #   # pin BELOW the drive count is fine and not reported: every drive is still claimed, on fewer
  #   # cores. Skipped before any drive is signed (see cluster_drives_unsigned_advisory).
  #   cluster_auto_full_drives_feasible:    default  # strict: error | relaxed: warn
  #
  #   # Auto-full-drives places one container per eligible node, so a role nodeSelector matching fewer
  #   # nodes than the form-cluster floor (FORM_CLUSTER_MIN_{DRIVE,COMPUTE}_CONTAINERS, 5 by default)
  #   # can never form a cluster. The drive side is otherwise a silent hang on MinContainersNotReady —
  #   # the planner calls that plan feasible — which is why this rule survives alongside
  #   # cluster_auto_full_drives_feasible, and owns the too-few-nodes case for both roles.
  #   cluster_auto_full_drives_min_nodes:   default  # strict: error | relaxed: warn
  #
  #   # No matched drive-role node carries the drive annotation this cluster's mode consumes
  #   # (weka-shared-drives for drive-sharing, weka-full-drives otherwise) — covers unsigned and
  #   # signed-in-the-other-mode alike, so the drive checks above are skipped. Advisory only:
  #   # applying before signing is a valid order of operations.
  #   cluster_drives_unsigned_advisory:     default  # strict: warn   | relaxed: warn
  #
  #   # For each role, container count must not exceed the number of
  #   # nodes matching that role's selector — a role hosts at most
  #   # one container per node.
  #   cluster_selected_nodes_count:         default  # strict: error  | relaxed: warn
  #
  #   # A pinned driveContainers/computeContainers below the minimum weka needs to form a cluster at
  #   # all (FORM_CLUSTER_MIN_{DRIVE,COMPUTE}_CONTAINERS, 5 by default, 3 with ALLOW_SINGLE_PARITY).
  #   # Error in both modes: below the minimum, FormCluster refuses to proceed and the cluster loops on
  #   # MinContainersNotReady forever with its containers healthy but idle. Only explicit pins are
  #   # checked (auto-full-drives leaves both counts at 0 — see cluster_auto_full_drives_min_nodes).
  #   cluster_min_containers:               default  # strict: error  | relaxed: error
  #
  #   # When driversDistService is an in-cluster Service URL, that
  #   # Service must exist. External URLs (e.g. drivers.weka.io)
  #   # are not validated.
  #   cluster_drivers_dist_service_exists:  default  # strict: error  | relaxed: warn
  #
  #   # Hugepages requested by Weka containers must fit the matched
  #   # nodes' hugepages-2Mi allocatable. Skipped when *Hugepages=0
  #   # (the operator auto-derives the value).
  #   cluster_hugepages_available:          default  # strict: warn   | relaxed: warn
  #
  #   # NIC count requested per node must not exceed the node's
  #   # weka.io/nics allocatable.
  #   cluster_network_ethdevice:            default  # strict: warn   | relaxed: warn
  #
  #   # startIoConditions.minNumDrives must not exceed
  #   # driveContainers × numDrives — otherwise the cluster can
  #   # never satisfy its IO-start condition.
  #   cluster_min_drives_feasibility:       default  # strict: error  | relaxed: error
  #
  #   # On large clusters (driveContainers > 10 AND numDrives > 2),
  #   # minNumDrives should be ≥ 90% of total drive capacity so IO
  #   # cannot resume after significant drive loss.
  #   cluster_min_drives_large_floor:       default  # strict: warn   | relaxed: warn
  #
  #   # On small clusters (driveContainers ≤ 10 OR numDrives ≤ 2),
  #   # setting minNumDrives is usually unnecessary and may cause
  #   # unexpected behavior — recommended to omit the field.
  #   cluster_min_drives_small_advisory:    default  # strict: warn   | relaxed: warn
  #
  #   # When dataServicesContainers > 0, dataServicesFeCores must be 0.
  #   # Data services containers must not have frontend cores assigned.
  #   cluster_dataservices_fe_cores:        default  # strict: error  | relaxed: error
  #
  #   # When clusterCapacity is set, stripeWidth/redundancyLevel/hotSpare must
  #   # meet the 3+2+0 floor (sw>=3, rl>=2, hs>=0 / hot spare optional). A lower
  #   # value produces a degenerate or unbootable cluster.
  #   cluster_capacity_protection:          default  # strict: error  | relaxed: error
  #
  #   # clusterCapacity only: its structural lower bound — the protection scheme's failure-domain floor
  #   # (stripeWidth+redundancyLevel+hotSpare) — sits below FORM_CLUSTER_MIN_DRIVE_CONTAINERS. The
  #   # drive-container count is derived from a capacity target, not a spec field, so nothing pinned
  #   # reaches cluster_min_containers while weka itself refuses to form and loops on
  #   # MinContainersNotReady. Warn-only: the floor is a bound, and the planner may still choose more.
  #   cluster_capacity_min_drive_containers: default  # strict: warn   | relaxed: warn
  #
  #   # Greenfield clusterCapacity only: the target + driveTypesRatio cannot spread an active pool
  #   # across at least numFDmin failure domains of at least clusterCapacity.minChunkSizeGiB (384 GiB)
  #   # each — per pool, clusterCapacity × poolPart/(tlc+qlc) >= 384 × stripeWidth. TLC and QLC are
  #   # checked independently. Does not fire once TLC-bearing drive containers exist (an in-place
  #   # migration or an established cluster already clears the floor, and the planner only grows).
  #   cluster_capacity_chunk_feasibility:   default  # strict: error  | relaxed: error
  #
  #   # When spec.overrides.skipDefaultFilesystemCreation is set, the operator
  #   # stops managing features that hardcode the `default` filesystem: any
  #   # configured telemetry export (filesystem-level audit is skipped; cluster-
  #   # level audit still runs), and operator-created CSI storage classes. One
  #   # violation is reported per unmet dependency.
  #   cluster_skip_default_fs:              default  # strict: warn   | relaxed: warn
  #
  #   # Scheduling-related fields (tolerations, nodeSelector, per-role
  #   # label/annotation maps, failureDomain topology keys/skew, podConfig
  #   # affinity/topologySpreadConstraints) must have syntax the API server
  #   # would accept — invalid values are caught at CR apply instead of
  #   # pod create.
  #   cluster_podspec_syntax:               default  # strict: error  | relaxed: error
  #
  #   # WekaClient.spec.targetCluster must reference an existing
  #   # WekaCluster.
  #   client_target_cluster_exists:         default  # strict: error  | relaxed: warn
  #
  #   # Scheduling-related fields (tolerations, nodeSelector, csiConfig
  #   # advanced labels/tolerations) must have syntax the API server
  #   # would accept — invalid values are caught at CR apply instead of
  #   # pod create.
  #   client_podspec_syntax:                default  # strict: error  | relaxed: error
  #
  #   # Decreasing any cores field on a WekaCluster (spec.dynamicTemplate.*Cores)
  #   # is denied — reducing cores on a running cluster can destabilize
  #   # active workloads. Applies on Update only; also blocks unsetting an
  #   # explicit value back to 0 (operator-derived).
  #   cluster_cores_decrease:               default  # strict: error  | relaxed: error
  #
  #   # An update that changes the cluster's DERIVED sizing mode (auto-full-drives vs explicit
  #   # container counts vs capacity) while drive containers already exist is denied — the two sizing
  #   # regimes would plan the same drives differently, and nothing ever removes the surplus. Two
  #   # switches ARE supported and stay allowed: explicit container counts -> auto-full-drives (the
  #   # running containers are adopted and grown in place), and containerCapacity/driveCapacity ->
  #   # clusterCapacity (the in-place migration). Revert anything else to keep the current mode.
  #   cluster_sizing_mode_flip:             default  # strict: error  | relaxed: error
  #
  #   # Decreasing spec.numCores (or spec.dataServicesConfig.dataServicesFeCores)
  #   # on a WekaContainer is denied for the same reason. spec.extraCores is not
  #   # checked: it is never handed to weka, so shrinking it only narrows the
  #   # pod's cpuset.
  #   container_cores_decrease:             default  # strict: error  | relaxed: error
  #
  #   # Decreasing spec.coresNum on a WekaClient is denied.
  #   client_cores_decrease:                default  # strict: error  | relaxed: error


# -- Bind-mount the host's /run/weka/ephemeral/shared-netns into weka runtime containers with bidirectional
# mount propagation, so network namespaces created on either side propagate to the other.
# Set to false only if you need to isolate the weka container from host netns changes.
# @section -- Networking & ports
netnsEnabled: true
