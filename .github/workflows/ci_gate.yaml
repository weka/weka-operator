# Required check `ci-gate` on main for GitHub native stacked PRs, no merge queue.
#
# `ci-gate` is a COMMIT STATUS posted by the `report_status` job, never a job name:
# - a lower stack layer gets no status, shows "Expected", and cannot be merged on its own,
#   UNLESS its own commits need no test (all chore/docs, or label `skip_ci_gate`), in which
#   case it passes itself and never waits for the layer above;
# - the top of a stack (or any layer with label `run_ci_gate`) runs the tests, marks the
#   layers below `pending` while it runs and `success` when it passes, so a human can merge the
#   stack up to that layer with "Merge stack";
# - label `skip_ci_gate`, or a PR whose commits are all chore/docs, counts as a pass for
#   that PR; a lower layer inherits such a pass only if it is skippable itself (same label, or
#   its own commits are all chore/docs).
name: ci-gate
on:
  pull_request:
    # ready_for_review: drafts are skipped, so the check must re-run when a draft is promoted.
    # labeled / unlabeled: run_ci_gate / skip_ci_gate added or removed.
    types: [opened, synchronize, labeled, unlabeled, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write   # post the `ci-gate` status
  actions: write    # wait step lists runs; gate cancels redundant lower-layer runs

# One run at a time per PR: re-pushing a PR cancels its own stale run, so that run cannot mark
# the layers below green after the newer run held them. Runs of other PRs are never cancelled.
# Hardware serialization across PRs is the "Wait for the test hardware" step, not this group.
# A label event for anything but the two gate labels parks itself in its own group: adding an
# unrelated label must not cancel a running test.
concurrency:
  group: ci-gate-pr-${{ github.event.pull_request.number }}-${{ (!github.event.label.name || github.event.label.name == 'run_ci_gate' || github.event.label.name == 'skip_ci_gate') && 'gate' || github.event.label.name }}
  cancel-in-progress: true

env:
  INITIAL_WEKA_VERSION: "quay.io/weka.io/weka-in-container:4.4.23"
  NEW_WEKA_VERSION: "quay.io/weka.io/weka-in-container:5.1.20.7"

jobs:
  gate:
    # Runs for every ready (non-draft) same-repo PR. Position in the stack decides the verdict
    # (test / skip / blocked), not whether this job runs: a lower layer has to reach the decide
    # step to find out whether its own commits need a test at all.
    # The same-repo clause is not overridable by any label: fork PRs never run the tests, never
    # take the skip path, and never get an `ci-gate` status.
    # A label event for any other label is a no-op: report_status is skipped along with gate,
    # so the status already on the head SHA is left alone. A blocked layer posts nothing new
    # either, except to reset a green it posted itself - see doc/dev/ci-gate.md.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      (!github.event.label.name ||
       github.event.label.name == 'run_ci_gate' ||
       github.event.label.name == 'skip_ci_gate')
    runs-on: ubuntu-latest
    outputs:
      skip_test: ${{ steps.decide.outputs.skip_test }}
      skip_reason: ${{ steps.decide.outputs.skip_reason }}
      blocked: ${{ steps.decide.outputs.blocked }}
      held_layers: ${{ steps.decide.outputs.held_layers }}
    steps:
      - name: Show PR Info
        run: |
          echo "PR branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"
          echo "Labels: ${{ toJson(github.event.pull_request.labels.*.name) }}"
          echo "Stack: ${{ toJson(github.event.pull_request.stack) }}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Only commit subjects are read here; this job now runs on every layer of a stack.
          filter: blob:none
          fetch-tags: false

      # 1. Verdict for THIS PR:
      #      skip_ci_gate label                 -> skip (counts as a pass)
      #      run_ci_gate label                  -> test
      #      lower layer, own commits chore/docs -> skip
      #      lower layer, own commits need test -> blocked (no status, the top covers it)
      #      all commits since the stack base   -> skip
      #        (or base branch) are chore/docs
      #      otherwise                          -> test
      # 2. Layers below this PR in the stack (only when stacked), bottom to top:
      #      a layer skippable on its own merits (skip label, or its own commits are chore/docs)
      #        is greened right away under either verdict; a skip verdict leaves others untouched.
      #      verdict = test: cancel the remaining layers' in-progress runs (redundant, this run
      #        covers them), post `pending` unless one already has its own green result, and
      #        remember its SHA in `held_layers` so report_status can mirror the pass onto exactly
      #        that SHA. A layer carrying run_ci_gate is left alone: its own run is wanted.
      #    Statuses go on head SHAs, so a layer pushed later gets nothing and stays blocked.
      - name: Decide test vs skip, prepare lower layers
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          STACK: ${{ github.event.pull_request.stack.number }}
          POS: ${{ github.event.pull_request.stack.position }}
          SIZE: ${{ github.event.pull_request.stack.size }}
          STACK_BASE: ${{ github.event.pull_request.stack.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          labels() { gh api "repos/$GITHUB_REPOSITORY/pulls/$1" --jq '.labels[].name'; }
          # 0 when every non-merge commit in the range is chore/docs (nothing to test). An empty
          # range is NOT chore-only: for a stack top or non-stacked PR it means the range itself
          # is wrong, and a test is the safe answer.
          chore_only() {
            local msgs; msgs=$(git log --no-merges --format=%s "$1")
            [[ -z "$msgs" ]] && return 1
            while IFS= read -r m; do
              [[ -z "$m" ]] && continue
              [[ "$m" =~ ^(chore|docs)(\(|:|\!) ]] || return 1
            done <<< "$msgs"
          }
          # Cancels a lower layer's own in-progress ci-gate runs: this run covers it, and a run
          # this job cancels posts no status (report_status runs only when not cancelled), so it
          # cannot write over what this run posts on that SHA.
          cancel_runs() {  # sha num
            for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$1&event=pull_request&per_page=20" \
                --jq '.workflow_runs[]|select(.name=="ci-gate" and (.status=="in_progress" or .status=="queued" or .status=="waiting"))|.id'); do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel" >/dev/null && echo "cancelled run $run of #$2"
            done
          }
          post() {  # sha state description
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$1" -f context=ci-gate \
              -f state="$2" -f target_url="$RUN_URL" -f description="$3" >/dev/null
            echo "ci-gate=$2 on ${1:0:7}: $3"
          }

          # ---- this PR: test, skip (counts as a pass), or blocked (no status, the layer above
          #      covers it)?
          my_labels=$(labels "$PR")
          blocked=false
          if grep -qx skip_ci_gate <<< "$my_labels"; then
            skip=true; why="skipped: label skip_ci_gate on PR #$PR"
          elif grep -qx run_ci_gate <<< "$my_labels"; then
            skip=false; why="label run_ci_gate"
          elif [[ -n "$STACK" && "$POS" != "$SIZE" ]]; then
            # A lower layer never runs the stack's test - the top covers that - but it must not
            # wait for the top when its own commits need no test. Its own range is
            # base..head: in a stack, a PR's base ref IS the layer below it.
            # The base is another PR's branch: fetch its current tip. It can be gone (the layer
            # below merged and was deleted before this PR was retargeted); that must not fail
            # the required check, so a missing base means blocked, never a job failure.
            base=""
            git fetch --no-tags --quiet origin "$BASE_REF" && base=$(git rev-parse FETCH_HEAD)
            if [[ -n "$base" ]] && chore_only "$base..$HEAD_SHA"; then
              skip=true; why="skipped: all commits since $BASE_REF are chore/docs"
            else
              blocked=true; skip=true; why="lower layer with code commits: covered by the stack top"
            fi
          else
            # A stack top covers every layer: inspect all commits since the stack base, up to the
            # PR head (HEAD is the synthetic merge commit on pull_request events).
            range="origin/${STACK_BASE:-$BASE_REF}..$HEAD_SHA"
            if chore_only "$range"; then skip=true; why="skipped: all commits since ${STACK_BASE:-$BASE_REF} are chore/docs"
            else skip=false; why="commits in $range need the upgrade test"; fi
          fi
          echo "skip_test=$skip blocked=$blocked ($why)"
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          echo "skip_test=$skip" >> "$GITHUB_OUTPUT"
          echo "skip_reason=$why" >> "$GITHUB_OUTPUT"

          # Blocked: post nothing new (report_status is skipped too), so the PR keeps showing
          # "Expected" until the top's run greens it. Holding the layers below is the top's job.
          # A skip-based green ("skipped...", posted by this layer or mirrored by a top) is stale
          # once the layer is blocked - a skip_ci_gate label removed on the same SHA leaves one
          # behind - and is reset to pending, or the layer would stay mergeable untested. A green
          # from a passed test is left alone.
          if [[ "$blocked" == "true" ]]; then
            stale_skip=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status" |
              jq -r '.statuses[]|select(.context=="ci-gate" and .state=="success" and ((.description // "")|startswith("skipped")))|.state')
            [[ -n "$stale_skip" ]] && post "$HEAD_SHA" pending "waiting for the stack top, on PR #$PR"
            echo "#$PR is $why"
            exit 0
          fi

          # Without this, a rerun on the same SHA (label event, manual re-run) keeps the previous
          # success as the latest status, so the PR reads as mergeable while it re-tests. Not on a
          # skip: report_status greens it moments later, and a stack top may already have greened
          # and cancelled this run - a pending landing after that green would stick.
          [[ "$skip" == "true" ]] || post "$HEAD_SHA" pending "ci-gate running on PR #$PR"

          # ---- layers below (bottom to top), only for stacked PRs
          held=""
          if [[ -n "$STACK" ]]; then
            prev="origin/$STACK_BASE"
            while read -r sha num; do
              [[ -z "$sha" ]] && continue
              lay_labels=$(labels "$num")
              # Combined status: newest per context. `gh api --jq` takes no --arg, so the PR
              # number goes through a real jq call instead of being spliced into the filter.
              own_green=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" |
                jq -r --arg num "$num" '.statuses[]|select(.context=="ci-gate" and .state=="success" and ((.description // "")|endswith("on PR #" + $num)))|.state')
              # A layer skippable on its own merits is greened here under either verdict, so its
              # self-skip does not depend on which run finishes first. Its own run is cancelled
              # first: it may be a real test from when that layer was briefly the stack top, and
              # its later result must not land on top of this green.
              if grep -qx run_ci_gate <<< "$lay_labels"; then
                echo "#$num has run_ci_gate: its own run decides"
              elif grep -qx skip_ci_gate <<< "$lay_labels"; then
                cancel_runs "$sha" "$num"
                post "$sha" success "skipped: label skip_ci_gate on PR #$num, via PR #$PR"
              elif chore_only "$prev..$sha"; then
                cancel_runs "$sha" "$num"
                post "$sha" success "skipped: chore/docs only, via PR #$PR"
              elif [[ "$skip" == "true" ]]; then
                echo "#$num is not skippable, left as is"
              else
                # Its own in-progress run (typically the first round after `gh stack submit`) is
                # redundant: this run covers it. Its cancelled jobs stop their remote executions.
                cancel_runs "$sha" "$num"
                if [[ -n "$own_green" ]]; then echo "#$num keeps its own green ci-gate"
                else post "$sha" pending "waiting for the upgrade test on PR #$PR"; fi
                held="$held $sha"
              fi
              prev=$sha
            done < <(gh api "repos/$GITHUB_REPOSITORY/stacks/$STACK" \
              --jq ".pull_requests[:$((POS-1))][] | select(.state==\"open\") | \"\(.head.sha) \(.number)\"")
          fi
          echo "held_layers=${held# }" >> "$GITHUB_OUTPUT"

  upgrade_extended_test:
    needs: [gate]
    if: |
      needs.gate.result == 'success' &&
      needs.gate.outputs.skip_test != 'true'
    env:
      GOPRIVATE: github.com/weka
    name: upgrade_extended_test
    outputs:
      operator_image: ${{ steps.set-operator-versions.outputs.operator_image }}
      operator_helm_image: ${{ steps.set-operator-versions.outputs.operator_helm_image }}
    runs-on: scalar-runners
    steps:
      - name: Wait for the test hardware
        # One execution at a time on the lab cluster (operator-mq-ci), across all PRs. Newer runs
        # wait for older in-progress runs of this workflow; nothing is dropped. (A global
        # `concurrency` group would drop runs: GitHub keeps only one pending run per group.)
        uses: softprops/turnstyle@v2
        with:
          same-branch-only: false
          poll-interval-seconds: 30

      - name: Check Docker
        # The dind sidecar of the ephemeral runner may still be starting up.
        run: |
          for i in $(seq 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker version
          docker info

      - name: Validate required variables
        run: |
          if [ -z "${{ vars.CI_OPERATOR_REPO }}" ]; then
            echo "::error::CI_OPERATOR_REPO repository variable is not set. Please set it in Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
          if [ -z "${{ vars.CI_HELM_REPO }}" ]; then
            echo "::error::CI_HELM_REPO repository variable is not set. Please set it in Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
          if [ -z "${{ vars.WEKA_TESTING_SERVICE_URL }}" ]; then
            echo "::error::WEKA_TESTING_SERVICE_URL repository variable is not set."
            exit 1
          fi
          echo "CI_OPERATOR_REPO is set to: ${{ vars.CI_OPERATOR_REPO }}"
          echo "CI_HELM_REPO is set to: ${{ vars.CI_HELM_REPO }}"
          echo "WEKA_TESTING_SERVICE_URL is set to: ${{ vars.WEKA_TESTING_SERVICE_URL }}"

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.SCALAR_WORKERS_APP_ID }}
          private-key: ${{ secrets.SCALAR_WORKERS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
 
      - name: Checkout operator repository
        uses: actions/checkout@v6
        with:
          path: operator
          submodules: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Publish Operator
        uses: dagger/dagger-for-github@v8.2.0
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HELM_USERNAME: ${{ secrets.CI_HELM_USERNAME }}
          HELM_PASSWORD: ${{ secrets.CI_HELM_PASSWORD }}
        with:
          version: "0.21.8"
          workdir: operator/.dagger/src
          module: operator_flows
          args: >-
            publish-operator-and-get-versions
            --operator=${{ github.workspace }}/operator
            --gh-token="env://GH_TOKEN"
            --sock=/var/run/docker.sock
            --operator-repo=${{ vars.CI_OPERATOR_REPO }}
            --helm-repo=${{ vars.CI_HELM_REPO }}
            --helm-username="env://HELM_USERNAME"
            --helm-password="env://HELM_PASSWORD"
            --output ${{ github.workspace }}/versions
      
      - name: Set Operator Versions (to output and environment variables)
        id: set-operator-versions
        run: |
          echo "Setting operator versions as environment variables"
          versions=$(cat ${{ github.workspace }}/versions)
          operator_image=$(echo "$versions" | head -n 1)
          operator_helm_image=$(echo "$versions" | tail -n 1)

          echo "Operator Image: $operator_image"
          echo "Operator Helm Image: $operator_helm_image"
          
          echo "operator_image=$operator_image" >> $GITHUB_ENV
          echo "operator_helm_image=$operator_helm_image" >> $GITHUB_ENV

          echo "operator_image=$operator_image" >> $GITHUB_OUTPUT
          echo "operator_helm_image=$operator_helm_image" >> $GITHUB_OUTPUT

      - name: Run Upgrade-extended Test via Testing Service
        env:
          # Passed via env (not inline ${{ }}) to avoid shell injection from a user-controlled PR title.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          OPERATOR_VERSION=$(echo "${{ env.operator_image }}" | sed 's/.*://')
          OPERATOR_IMAGE_REPO=$(echo "${{ env.operator_image }}" | sed 's/:.*//')
          OPERATOR_HELM_IMAGE_REPO=$(echo "${{ env.operator_helm_image }}" | sed 's/:.*//')

          BODY=$(jq -n \
            --arg operator_version "$OPERATOR_VERSION" \
            --arg operator_image_repo "$OPERATOR_IMAGE_REPO" \
            --arg operator_helm_image_repo "$OPERATOR_HELM_IMAGE_REPO" \
            --arg initial_version "${{ env.INITIAL_WEKA_VERSION }}" \
            --arg new_version "${{ env.NEW_WEKA_VERSION }}" \
            '{
              "flowName": "upgrade-extended",
              "kubeContext": "operator-mq-ci",
              "config": {
                "flowName": "upgrade-extended",
                "operator-version": $operator_version,
                "operator-image": $operator_image_repo,
                "operator-helm-image": $operator_helm_image_repo,
                "initial-version": $initial_version,
                "new-version": $new_version,
                "namespace": "test-upgrade-extended",
                "cluster-name": "upgrade-extended",
                "node-selector": {"weka.io/dedicated": "upgrade-extended"},
                "cleanup": "on-start",
                "runs-in-lab": true,
                "with-s3": true,
                "with-data-services": true,
                "local-builder": true
              }
            }')

          HTTP_RESPONSE=$(curl --retry 3 --retry-delay 5 --retry-connrefused -sS \
            -w "\n%{http_code}" \
            -X POST "${{ vars.WEKA_TESTING_SERVICE_URL }}/api/executions" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
          RESPONSE=$(echo "$HTTP_RESPONSE" | sed '$d')
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "::error::testing service POST /api/executions returned HTTP $HTTP_CODE. Response: $RESPONSE"
            exit 1
          fi
          EXECUTION_ID=$(echo "$RESPONSE" | jq -r '.execution_id // empty')
          if [ -z "$EXECUTION_ID" ]; then
            echo "::error::testing service did not return execution_id. Response: $RESPONSE"
            exit 1
          fi
          echo "::notice::Execution: ${{ vars.WEKA_TESTING_SERVICE_URL }}/execution/$EXECUTION_ID"
          # A file, not $GITHUB_ENV: env additions apply only once a step ends, and this step
          # then polls for an hour. Cancellation lands mid-poll, which is exactly when the
          # cleanup step below needs the id.
          echo "$EXECUTION_ID" > "$RUNNER_TEMP/execution_id"

          # Send Slack notification with execution link
          EXECUTION_URL="${{ vars.WEKA_TESTING_SERVICE_URL }}/execution/$EXECUTION_ID"
          SLACK_PAYLOAD=$(jq -n \
            --arg url "$EXECUTION_URL" \
            --arg pr_title "$PR_TITLE" \
            --arg pr_number "${{ github.event.pull_request.number }}" \
            --arg pr_url "${{ github.event.pull_request.html_url }}" \
            --arg base "${{ github.base_ref }}" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              "text": ":rocket: upgrade-extended test started",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": (":rocket: *upgrade-extended test started*\n*PR:* <" + $pr_url + "|#" + $pr_number + " " + $pr_title + ">\n*Target:* `" + $base + "`\n*<" + $url + "|Execution Link>* | *<" + $run_url + "|GitHub Actions Run>*")
                  }
                }
              ]
            }')
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -sf -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "$SLACK_PAYLOAD" || echo "::warning::Failed to send Slack notification"
          fi

          SLEEP_SECONDS=60
          MAX_POLLS=60
          MAX_CONSECUTIVE_EMPTY=5
          consecutive_empty=0
          CURL_ERR=$(mktemp)
          RESP_BODY=$(mktemp)
          for ((i=1; i<=MAX_POLLS; i++)); do
            # -S keeps the error message on transient failures; -w captures the HTTP code so an
            # empty status leaves a clue (network drop vs bad gateway vs unexpected body).
            HTTP_CODE=$(curl --retry 3 --retry-delay 5 --retry-connrefused -sS \
              -o "$RESP_BODY" -w '%{http_code}' \
              "${{ vars.WEKA_TESTING_SERVICE_URL }}/api/executions/$EXECUTION_ID" \
              -H "Content-Type: application/json" 2>"$CURL_ERR")
            CURL_RC=$?
            # `// empty` so a missing/null .status yields "" instead of the string "null"
            STATUS=$(jq -r '.status // empty' < "$RESP_BODY" 2>/dev/null)
            echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] [$i/$MAX_POLLS] Status: ${STATUS:-<unreachable>}"
            if [[ "$STATUS" == "succeeded" ]]; then break; fi
            # Empty status means the poll request failed (network blip) or returned no body,
            # not that the test reached a bad state. Tolerate transient blips; only give up
            # after several in a row in case the service is genuinely down.
            if [[ -z "$STATUS" ]]; then
              consecutive_empty=$((consecutive_empty + 1))
              echo "::warning::could not read execution status (attempt $consecutive_empty/$MAX_CONSECUTIVE_EMPTY) - retrying"
              echo "  curl exit=$CURL_RC http_code=${HTTP_CODE:-none}"
              [[ -s "$CURL_ERR" ]] && echo "  curl error: $(cat "$CURL_ERR")"
              [[ -s "$RESP_BODY" ]] && echo "  response body (truncated): $(head -c 300 "$RESP_BODY")"
              if [[ $consecutive_empty -ge $MAX_CONSECUTIVE_EMPTY ]]; then
                echo "::error::testing service unreachable for $MAX_CONSECUTIVE_EMPTY consecutive polls"
                exit 1
              fi
            elif [[ "$STATUS" != "running" && "$STATUS" != "pending" ]]; then
              echo "::error::upgrade-extended test failed with status: $STATUS"
              exit 1
            else
              consecutive_empty=0
            fi
            if [[ $i -eq $MAX_POLLS ]]; then
              echo "::error::upgrade-extended test timed out after $((MAX_POLLS * SLEEP_SECONDS / 60)) minutes"
              exit 1
            fi
            sleep "$SLEEP_SECONDS"
          done

      - name: Stop remote execution if this job was cancelled
        # Cancelling the GitHub job (newer push, or a stack top cancelling a redundant lower-layer
        # run) does not stop the execution on the testing service; stop it so the hardware is free.
        if: cancelled()
        run: |
          EXECUTION_ID=$(cat "$RUNNER_TEMP/execution_id" 2>/dev/null || true)
          if [ -z "$EXECUTION_ID" ]; then echo "no execution to stop"; exit 0; fi
          curl --fail --retry 3 --retry-delay 5 -sS -X POST \
            "${{ vars.WEKA_TESTING_SERVICE_URL }}/api/executions/$EXECUTION_ID/stop" \
            -H "Content-Type: application/json" \
            && echo "stopped execution $EXECUTION_ID" || echo "::warning::could not stop execution $EXECUTION_ID"

  clients_only_test:
    needs: [gate, upgrade_extended_test]
    if: |
      needs.gate.result == 'success' &&
      needs.gate.outputs.skip_test != 'true' &&
      needs.upgrade_extended_test.result == 'success'
    runs-on: scalar-runners
    steps:
      - name: Validate required variables
        run: |
          if [ -z "${{ vars.CI_OPERATOR_REPO }}" ]; then
            echo "::error::CI_OPERATOR_REPO repository variable is not set"
            exit 1
          fi
          if [ -z "${{ vars.CI_HELM_REPO }}" ]; then
            echo "::error::CI_HELM_REPO repository variable is not set"
            exit 1
          fi
          if [ -z "${{ vars.WEKA_TESTING_SERVICE_URL }}" ]; then
            echo "::error::WEKA_TESTING_SERVICE_URL repository variable is not set."
            exit 1
          fi

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.SCALAR_WORKERS_APP_ID }}
          private-key: ${{ secrets.SCALAR_WORKERS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout operator repository
        uses: actions/checkout@v6
        with:
          path: operator
          token: ${{ steps.app-token.outputs.token }}

      - name: Pre clients-only (copy secrets + get join IPs)
        uses: dagger/dagger-for-github@v8.2.0
        env:
          SOURCE_KUBECONFIG: ${{ secrets.UPGRADE_TEST_KUBECONFIG }}
          OCP_KUBECONFIG: ${{ secrets.OCP_CLUSTER_KUBECONFIG }}
        with:
          version: "0.21.8"
          workdir: operator/.dagger/src
          module: operator_flows
          args: >-
            pre-clients-only
            --source-kubeconfig="env://SOURCE_KUBECONFIG"
            --target-kubeconfig="env://OCP_KUBECONFIG"
            --cache-buster="${{ github.run_id }}-${{ github.run_attempt }}"
            --output ${{ github.workspace }}/join-ips

      - name: Run Clients-Only Test via Testing Service
        run: |
          OPERATOR_VERSION=$(echo "${{ needs.upgrade_extended_test.outputs.operator_image }}" | sed 's/.*://')
          OPERATOR_IMAGE_REPO=$(echo "${{ needs.upgrade_extended_test.outputs.operator_image }}" | sed 's/:.*//')
          OPERATOR_HELM_IMAGE_REPO=$(echo "${{ needs.upgrade_extended_test.outputs.operator_helm_image }}" | sed 's/:.*//')
          JOIN_IPS_JSON=$(tr ',' '\n' < "${{ github.workspace }}/join-ips" | jq -R . | jq -cs 'map(select(length > 0))')
          if [[ "$JOIN_IPS_JSON" == "[]" ]]; then
            echo "::error::pre-clients-only returned no join IPs"
            exit 1
          fi

          BODY=$(jq -n \
            --arg operator_version "$OPERATOR_VERSION" \
            --arg operator_image_repo "$OPERATOR_IMAGE_REPO" \
            --arg operator_helm_image_repo "$OPERATOR_HELM_IMAGE_REPO" \
            --arg weka_image "${{ env.NEW_WEKA_VERSION }}" \
            --argjson join_ips "$JOIN_IPS_JSON" \
            '{
              "flowName": "clients-only",
              "kubeContext": "ocp_clients",
              "config": {
                "flowName": "clients-only",
                "operator-version": $operator_version,
                "operator-image": $operator_image_repo,
                "operator-helm-image": $operator_helm_image_repo,
                "weka-image": $weka_image,
                "namespace": "test-upgrade-extended",
                "join-ips": $join_ips,
                "weka-secret-ref": "weka-client-upgrade-extended",
                "csi-secret-name": "weka-csi-upgrade-extended",
                "is-openshift": true
              }
            }')

          HTTP_RESPONSE=$(curl --retry 3 --retry-delay 5 --retry-connrefused -sS \
            -w "\n%{http_code}" \
            -X POST "${{ vars.WEKA_TESTING_SERVICE_URL }}/api/executions" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)
          RESPONSE=$(echo "$HTTP_RESPONSE" | sed '$d')
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "::error::testing service POST /api/executions returned HTTP $HTTP_CODE. Response: $RESPONSE"
            exit 1
          fi
          EXECUTION_ID=$(echo "$RESPONSE" | jq -r '.execution_id // empty')
          if [ -z "$EXECUTION_ID" ]; then
            echo "::error::testing service did not return execution_id. Response: $RESPONSE"
            exit 1
          fi
          echo "::notice::Execution: ${{ vars.WEKA_TESTING_SERVICE_URL }}/execution/$EXECUTION_ID"
          # A file, not $GITHUB_ENV: env additions apply only once a step ends, and this step
          # then polls for an hour. Cancellation lands mid-poll, which is exactly when the
          # cleanup step below needs the id.
          echo "$EXECUTION_ID" > "$RUNNER_TEMP/execution_id"

          SLEEP_SECONDS=60
          MAX_POLLS=60
          MAX_CONSECUTIVE_EMPTY=5
          consecutive_empty=0
          CURL_ERR=$(mktemp)
          RESP_BODY=$(mktemp)
          for ((i=1; i<=MAX_POLLS; i++)); do
            # -S keeps the error message on transient failures; -w captures the HTTP code so an
            # empty status leaves a clue (network drop vs bad gateway vs unexpected body).
            HTTP_CODE=$(curl --retry 3 --retry-delay 5 --retry-connrefused -sS \
              -o "$RESP_BODY" -w '%{http_code}' \
              "${{ vars.WEKA_TESTING_SERVICE_URL }}/api/executions/$EXECUTION_ID" \
              -H "Content-Type: application/json" 2>"$CURL_ERR")
            CURL_RC=$?
            # `// empty` so a missing/null .status yields "" instead of the string "null"
            STATUS=$(jq -r '.status // empty' < "$RESP_BODY" 2>/dev/null)
            echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] [$i/$MAX_POLLS] Status: ${STATUS:-<unreachable>}"
            if [[ "$STATUS" == "succeeded" ]]; then break; fi
            # Empty status means the poll request failed (network blip) or returned no body,
            # not that the test reached a bad state. Tolerate transient blips; only give up
            # after several in a row in case the service is genuinely down.
            if [[ -z "$STATUS" ]]; then
              consecutive_empty=$((consecutive_empty + 1))
              echo "::warning::could not read execution status (attempt $consecutive_empty/$MAX_CONSECUTIVE_EMPTY) - retrying"
              echo "  curl exit=$CURL_RC http_code=${HTTP_CODE:-none}"
              [[ -s "$CURL_ERR" ]] && echo "  curl error: $(cat "$CURL_ERR")"
              [[ -s "$RESP_BODY" ]] && echo "  response body (truncated): $(head -c 300 "$RESP_BODY")"
              if [[ $consecutive_empty -ge $MAX_CONSECUTIVE_EMPTY ]]; then
                echo "::error::testing service unreachable for $MAX_CONSECUTIVE_EMPTY consecutive polls"
                exit 1
              fi
            elif [[ "$STATUS" != "running" && "$STATUS" != "pending" ]]; then
              echo "::error::clients-only test failed with status: $STATUS"
              exit 1
            else
              consecutive_empty=0
            fi
            if [[ $i -eq $MAX_POLLS ]]; then
              echo "::error::clients-only test timed out after $((MAX_POLLS * SLEEP_SECONDS / 60)) minutes"
              exit 1
            fi
            sleep "$SLEEP_SECONDS"
          done

      - name: Stop remote execution if this job was cancelled
        # Cancelling the GitHub job (newer push, or a stack top cancelling a redundant lower-layer
        # run) does not stop the execution on the testing service; stop it so the hardware is free.
        if: cancelled()
        run: |
          EXECUTION_ID=$(cat "$RUNNER_TEMP/execution_id" 2>/dev/null || true)
          if [ -z "$EXECUTION_ID" ]; then echo "no execution to stop"; exit 0; fi
          curl --fail --retry 3 --retry-delay 5 -sS -X POST \
            "${{ vars.WEKA_TESTING_SERVICE_URL }}/api/executions/$EXECUTION_ID/stop" \
            -H "Content-Type: application/json" \
            && echo "stopped execution $EXECUTION_ID" || echo "::warning::could not stop execution $EXECUTION_ID"

  report_status:
    # Posts the required commit status `ci-gate`. Nothing is posted when `gate` was skipped
    # (draft, fork) or reported `blocked` (a lower layer whose own commits need a test): the PR
    # shows "Expected" and stays blocked until the stack top's run greens it.
    needs: [gate, upgrade_extended_test, clients_only_test]
    runs-on: ubuntu-latest
    # Not on a cancelled run either: a run cancelled by a stack top's sweep has possibly never
    # written `blocked`, and an `error` from it would land over the status the top just posted.
    if: "!cancelled() && needs.gate.result != 'skipped' && needs.gate.outputs.blocked != 'true'"
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GATE: ${{ needs.gate.result }}
      SKIP: ${{ needs.gate.outputs.skip_test }}
      SKIP_REASON: ${{ needs.gate.outputs.skip_reason }}
      UPGRADE: ${{ needs.upgrade_extended_test.result }}
      CLIENTS: ${{ needs.clients_only_test.result }}
      HELD: ${{ needs.gate.outputs.held_layers }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Turns the job results into one commit status on this PR's head SHA:
      #   gate failed                  -> failure
      #   gate said skip               -> success ("skipped: ..." says why)
      #   both tests passed            -> success
      #   otherwise                    -> failure (which test failed is in the description)
      # A success is also posted on every SHA in `held_layers` (the layers below that were held
      # pending at the start of this run), which is what lets "Merge stack" merge them together.
      # Failures are never mirrored: the held layers stay pending, i.e. blocked.
      - name: Post ci-gate status
        run: |
          set -euo pipefail
          # A commit status, not a check run: the latest status per context wins and it is not
          # tied to a check suite (a second run on the same SHA opens a new suite without it).
          if [[ "$GATE" != "success" ]]; then
            state=failure; desc="gate job failed on PR #$PR"
          elif [[ "$SKIP" == "true" ]]; then
            state=success; desc="${SKIP_REASON:-skipped} on PR #$PR"
          elif [[ "$UPGRADE" == "success" && "$CLIENTS" == "success" ]]; then
            state=success; desc="upgrade-extended and clients-only passed on PR #$PR"
          else
            state=failure; desc="upgrade-extended=$UPGRADE clients-only=$CLIENTS on PR #$PR"
          fi
          post() {
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$1" -f context=ci-gate \
              -f state="$state" -f target_url="$RUN_URL" -f description="$desc" >/dev/null
            echo "ci-gate=$state on ${1:0:7}"
          }
          # Mirror a pass onto the layers held at the start of this run (never onto a layer
          # pushed while the tests were running: its new SHA gets nothing and stays blocked).
          # Mirrors first: a failing mirror must not leave the required head status green while
          # a layer below is still pending.
          if [[ "$state" == "success" ]]; then
            for sha in $HELD; do post "$sha"; done
          fi
          post "$HEAD_SHA"
