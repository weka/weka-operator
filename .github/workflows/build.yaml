---
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# These jobs need no secrets, so they run on fork PRs too (once a maintainer approves the run).
# Every github.com/weka module is public and resolves through the module proxy, so neither the
# app token nor GOPRIVATE is needed here. The .gitmodules URL is SSH and there is no key on the
# runner, so the rewrite to HTTPS below is what lets the submodule clone.
jobs:
  # In a stack only the top layer runs CI: it contains every lower layer. Non-stacked
  # PRs and pushes to main always run. Fork PRs are never stacked, so they land here and run
  # once a maintainer approves the run (Actions approval policy: all_external_contributors).
  stack_gate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    steps:
      - run: echo "stack=${{ toJson(github.event.pull_request.stack) }}"

  lint:
    name: Lint
    needs: stack_gate
    runs-on: ubuntu-latest
    steps:
      - name: Use HTTPS for the submodule's SSH remote
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          only-new-issues: true

      - name: Lint pkg/weka-k8s-api
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          only-new-issues: true
          working-directory: pkg/weka-k8s-api

      - name: Check for typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  static-checks:
    name: Static Checks (deadcode)
    needs: stack_gate
    runs-on: ubuntu-latest
    steps:
      - name: Use HTTPS for the submodule's SSH remote
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            pkg/weka-k8s-api/go.sum
            pkg/go-steps-engine/go.sum

      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@latest

      - name: Run deadcode
        run: deadcode -test ./...

  security:
    name: Security (govulncheck)
    needs: stack_gate
    runs-on: ubuntu-latest
    steps:
      - name: Use HTTPS for the submodule's SSH remote
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            pkg/weka-k8s-api/go.sum
            pkg/go-steps-engine/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  test:
    name: Test
    needs: stack_gate
    runs-on: ubuntu-latest
    steps:
      - name: Use HTTPS for the submodule's SSH remote
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            pkg/weka-k8s-api/go.sum
            pkg/go-steps-engine/go.sum

      - name: Setup envtest
        run: |
          make envtest
          ./bin/setup-envtest use --bin-dir ./bin 1.26.0

      - name: Test
        run: |
          go generate ./...
          make generate
          make test

  build:
    name: Build
    needs: stack_gate
    runs-on: ubuntu-latest
    steps:
      - name: Use HTTPS for the submodule's SSH remote
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            pkg/weka-k8s-api/go.sum
            pkg/go-steps-engine/go.sum

      - name: Build
        run: go build ./...

  verify:
    name: Verify (mod tidy + generated code)
    needs: stack_gate
    runs-on: ubuntu-latest
    steps:
      - name: Use HTTPS for the submodule's SSH remote
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            pkg/weka-k8s-api/go.sum
            pkg/go-steps-engine/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          (cd pkg/weka-k8s-api && go mod tidy)
          git diff --exit-code go.mod go.sum pkg/weka-k8s-api/go.mod pkg/weka-k8s-api/go.sum

      - name: Verify generated code is current
        run: |
          make generate
          make manifests
          git diff --exit-code

  commitlint:
    name: Commitlint
    needs: stack_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Commitlint
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  secret-scan:
    name: Secret Scan (gitleaks)
    needs: stack_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # The action refuses to scan an organization repo without GITLEAKS_LICENSE, which a fork PR
      # never receives. The CLI carries no such restriction. It must be scoped to the PR's own
      # commits: the default is a full-history scan, which reports findings from long-merged
      # commits and would fail every fork PR regardless of what it changed.
      - name: Scan with gitleaks CLI (fork PR, no license available)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --no-banner --log-opts="$BASE_SHA..$HEAD_SHA"
