name: Reference Site

on:
  workflow_run:
    workflows: ["Package Operator (HELM)"]
    types: [completed]
    branches: [release/v1]
  workflow_dispatch:
    inputs:
      content_ref:
        description: "Ref for pkg/weka-k8s-api and charts/weka-operator (default: latest stable v1.* tag)"
        required: false
  pull_request:
    paths:
      - 'website/**'
      - 'pkg/weka-k8s-api/api/**'
      - 'charts/weka-operator/values.yaml'
      - 'charts/weka-operator/README.md'
      - 'charts/weka-operator/README.md.gotmpl'
      - '.github/workflows/docs.yaml'

permissions:
  contents: read

# Serialize build+deploy so an older tag can't deploy after a newer one; PR builds only serialize per PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Tags pushed by semantic-release with GITHUB_TOKEN don't trigger workflows, so resolve the latest stable tag here.
      # Tooling (website/) comes from the checked-out ref; only the documented content comes from the tag.
      - name: Resolve version
        env:
          EVENT: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          CONTENT_REF: ${{ inputs.content_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "OPERATOR_VERSION=${PR_SHA:0:7}" >> "$GITHUB_ENV"
          else
            ref=${CONTENT_REF:-$(git tag -l 'v1.*' --sort=-v:refname | grep -v -- - | head -1)}
            test -n "$ref"
            rm -rf pkg/weka-k8s-api charts/weka-operator
            git checkout "origin/$ref" -- pkg/weka-k8s-api charts/weka-operator 2>/dev/null ||
              git checkout "$ref" -- pkg/weka-k8s-api charts/weka-operator
            echo "OPERATOR_VERSION=$ref" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material==9.7.7

      - name: Build site
        run: website/preview-docs.sh --build-only

      - name: Upload site artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: website/site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
