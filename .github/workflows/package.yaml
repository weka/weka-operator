---
name: Package Operator (HELM)
run-name: ${{ github.actor }} is building the Helm package

# make sure only one workflow is running at a time
concurrency:
  group: package-operator
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - release/*

  workflow_dispatch:
    inputs:
      version-name:
        description: 'Name of the version to be released'
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  discussions: write
  checks: write


jobs:
  Helm-Release:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/weka
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ vars.SCALAR_WORKERS_APP_ID }}
          private-key: ${{ secrets.SCALAR_WORKERS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Setup access for private go modules
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf https://github.com/
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf git@github.com:
          echo "machine github.com login x-access-token password ${{ steps.app-token.outputs.token }}" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      # See: https://github.com/webfactory/ssh-agent?tab=readme-ov-file#using-multiple-deploy-keys-inside-docker-builds
      - name: Collect Git files in a directory that is part of the Docker build context
        run: |
          mkdir -p dockerfile_files
          cp -r ~/.gitconfig ~/.netrc dockerfile_files/
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum
            pkg/weka-k8s-api/go.sum
            pkg/go-steps-engine/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/jod'
          cache: 'npm'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Docker login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QuayUsername }}
          password: ${{ secrets.QuayPassword }}
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3
      - name: Login to Registry
        env:
          QUAY_USERNAME: ${{ secrets.QuayUsername }}
          QUAY_PASSWORD: ${{ secrets.QuayPassword }}
        run: helm registry login quay.io/weka.io --username "$QUAY_USERNAME" --password "$QUAY_PASSWORD"
      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch'
        run: npm install
      - name: Generating version
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --dry-run
      - name: Read VERSION from inputs
        id: version_input
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION_INPUT: ${{ github.event.inputs.version-name }}
        run: echo "VERSION=$VERSION_INPUT" >> $GITHUB_ENV
      - name: Read VERSION file
        id: version
        if: github.event_name != 'workflow_dispatch'
        run: echo "VERSION=$(cat .VERSION)" >> $GITHUB_ENV
      - name: build version
        if: ${{ env.VERSION != '' }}
        env:
          VERSION: ${{ env.VERSION }}
        run: ./build-release.sh
      - name: Create release
        if: ${{ env.VERSION != '' && github.event_name != 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
      - name: Add operator version as artifact
        if: ${{ env.VERSION != '' }}
        run: echo "$VERSION" > operator-version.txt
      - name: Upload artifact
        if: ${{ env.VERSION != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operator-version
          path: operator-version.txt
          retention-days: 1
