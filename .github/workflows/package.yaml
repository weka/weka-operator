---
name: Package Operator (HELM)
run-name: ${{ github.actor }} is building the Helm package

# make sure only one workflow is running at a time
concurrency:
  group: package-operator
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - release/*

  workflow_dispatch:
    inputs:
      version-name:
        description: 'Name of the version to be released'
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write


jobs:
  Helm-Release:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/weka
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.SCALAR_WORKERS_APP_ID }}
          private-key: ${{ secrets.SCALAR_WORKERS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Setup access for private go modules
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf https://github.com/
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf git@github.com:
          echo "machine github.com login x-access-token password ${{ steps.app-token.outputs.token }}" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum
            pkg/weka-k8s-api/go.sum
            pkg/go-steps-engine/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/jod'
          cache: 'npm'
      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch'
        run: npm ci
      - name: Generating version
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --dry-run
      - name: Read VERSION from inputs
        id: version_input
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION_INPUT: ${{ github.event.inputs.version-name }}
        run: echo "VERSION=$VERSION_INPUT" >> $GITHUB_ENV
      - name: Read VERSION file
        id: version
        if: github.event_name != 'workflow_dispatch'
        run: echo "VERSION=$(cat .VERSION)" >> $GITHUB_ENV
      # Registry auth is established here, immediately before the push, so the quay
      # credentials are not left in ~/.docker/config.json and the helm registry config
      # while the npm dependency tree is installed and executed above.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QuayUsername }}
          password: ${{ secrets.QuayPassword }}
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - name: Login to Registry
        env:
          QUAY_USERNAME: ${{ secrets.QuayUsername }}
          QUAY_PASSWORD: ${{ secrets.QuayPassword }}
        run: helm registry login quay.io/weka.io --username "$QUAY_USERNAME" --password "$QUAY_PASSWORD"
      - name: build version
        if: ${{ env.VERSION != '' }}
        env:
          VERSION: ${{ env.VERSION }}
        run: ./build-release.sh
      # semantic-release pushes the tag before its channel note, and resolves a tag's channel
      # from that note. A tag left without one is invisible on a prerelease branch, so every
      # later run recomputes the same version and dies on "tag already exists".
      - name: Drop half-released tag
        if: ${{ env.VERSION != '' && github.event_name != 'workflow_dispatch' }}
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # `ls-remote --exit-code` exits 2 for "no such ref" and 128 for a transport error.
          # A failed read must not pass as "missing": on the note lookup that would delete a
          # correctly released tag and detach its GitHub release.
          exists() {
            git ls-remote --exit-code origin "$1" >/dev/null && return 0
            local status=$?
            [ "$status" -eq 2 ] && return 1
            echo "::warning::could not read $1 from origin (exit $status); skipping the half-released tag check"
            exit 0
          }
          if exists "refs/tags/$tag" && ! exists "refs/notes/semantic-release-$tag"; then
            echo "::warning::$tag has no semantic-release note; deleting it to recreate the release"
            git push origin ":refs/tags/$tag"
            git tag -d "$tag" 2>/dev/null || true
          fi
      - name: Create release
        if: ${{ env.VERSION != '' && github.event_name != 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
      - name: Add operator version as artifact
        if: ${{ env.VERSION != '' }}
        run: echo "$VERSION" > operator-version.txt
      - name: Upload artifact
        if: ${{ env.VERSION != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-version
          path: operator-version.txt
          retention-days: 1
