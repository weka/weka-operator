name: Lint Helm Chart
run-name: ${{ github.actor }} is linting the Helm chart
on: [pull_request]

permissions:
  contents: read

jobs:
  Helm-Lint:
    # In a stack only the top layer runs: it contains every lower layer.
    if: >-
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0
      - name: List changes
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Lint
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          ct lint --target-branch ${{ github.event.repository.default_branch }} \
            --check-version-increment=false # version is managed by the release workflow
