version: 2
updates:
  # Keeps SHA-pinned actions in .github/workflows/ from ossifying: Dependabot
  # bumps the SHA and the trailing version comment when upstream releases.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/pkg/weka-k8s-api"
      - "/pkg/go-steps-engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      gomod:
        patterns: ["*"]

  # Base images in image.Dockerfile and build/taskmon/Dockerfile.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/build/taskmon"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
