# The commit-msg hook needs `pre-commit install` (installs both types) after this file changes.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --new-from-rev=HEAD --fix
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      - id: check-ainav
        name: check-ainav
        entry: python3 scripts/check-ainav.py
        language: system
        files: ^\.ainav/.*\.md$
        pass_filenames: false
        stages: [pre-commit]

      - id: helm-docs
        name: helm-docs
        entry: make helm-docs
        language: system
        files: ^charts/weka-operator/(values\.yaml|README\.md\.gotmpl)$
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/crate-ci/typos
    rev: v1.44.0
    hooks:
      - id: typos

  # Same rules as the Commitlint CI job (commitlint.config.js).
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
